<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0c122b"><title>Brawl Arena</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#fff;font-family:system-ui,Arial;background:radial-gradient(ellipse at 50% 20%,#344a83 0,#17234b 42%,#0b1027 100%);min-height:100vh;overflow-x:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:16px}.logo{font-weight:1000;font-size:23px;line-height:1;color:#ffe36b;text-shadow:0 3px #b54c23,0 5px #10152e;letter-spacing:-1px}.wallet{display:flex;gap:8px}.pill{background:#101a3bdc;border:2px solid #526da5;border-radius:14px;padding:7px 11px;font-weight:900}.hero{text-align:center;padding:12px 16px 4px}.season{color:#9feaff;font-size:12px;font-weight:900;letter-spacing:3px}.hero h1{font-size:36px;line-height:1.05;margin:8px 0;text-shadow:0 4px #19234c,0 6px #080d20}.fighter{height:250px;display:grid;place-items:center;position:relative}.orb{width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe78d,#f58c42 50%,#8a3e83 72%,transparent 73%);filter:drop-shadow(0 15px 22px #0008);display:grid;place-items:center;font-size:115px;border:5px solid #ffd76b;box-shadow:0 0 0 8px #ffffff14,0 0 45px #ffb84c55}.name{position:absolute;bottom:0;background:#14254c;border:2px solid #6d8fca;border-radius:12px;padding:7px 24px;font-weight:1000}.cta{display:block;margin:18px auto 10px;width:88%;max-width:360px;border:0;border-radius:16px;padding:17px;background:linear-gradient(#ffe875,#f3a72e);color:#57280e;font-size:22px;font-weight:1000;box-shadow:0 6px #9b521b;letter-spacing:1px}.sub{display:flex;justify-content:center;gap:10px;margin:12px}.tile{background:#17264d;border:2px solid #48679e;border-radius:14px;padding:13px 18px;font-weight:900;min-width:100px;text-align:center}.nav{position:fixed;bottom:0;left:0;right:0;background:#0a1026f5;border-top:1px solid #3a4d79;display:flex;justify-content:space-around;padding:12px 3px 18px}.nav button{background:none;border:0;color:#c5d7ff;font-weight:800;font-size:12px}.nav b{display:block;font-size:23px;margin-bottom:3px}.notice{text-align:center;color:#a9bbdf;font-size:11px;margin:14px 20px 90px}.panel{display:none;position:fixed;inset:0;background:#080d20f5;z-index:5;padding:30px 20px}.panel h2{text-align:center;margin-top:35px}.close{float:right;background:#314777;color:white;border:0;padding:10px 15px;border-radius:10px}.item{background:#1b2b55;border:1px solid #5675ae;padding:17px;margin:12px 0;border-radius:14px;font-weight:800}
</style></head><body>
<header class="top"><div class="logo">BRAWL<br>ARENA</div><div class="wallet"><div class="pill">🟡 <span id="coins">1250</span></div><div class="pill">💎 <span id="gems"> gems  </span></div></div></header>
<section class="hero"><div class="season">СЕЗОН 01 · АРЕНА ЛЕГЕНД</div><h1>ГОТОВ К БОЮ?</h1><div>Выбери бойца и покажи свой стиль</div></section>
<div class="fighter"><div class="orb">🤠</div><div class="name">RANGER · РАНГ 8</div></div>
<button class="cta" onclick="play()">⚔ ИГРАТЬ</button>
<div class="sub"><div class="tile" onclick="openPanel('fighters')">🥊<br>БОЙЦЫ</div><div class="tile" onclick="openPanel('shop')">🛒<br>МАГАЗИН</div><div class="tile" onclick="openPanel('profile')">👤<br>ПРОФИЛЬ</div></div>
<div class="notice">Демо-версия интерфейса · Онлайн-матчи и сервер пока не подключены</div>
<nav class="nav"><button onclick="openPanel('home')"><b>🏠</b>Главная</button><button onclick="openPanel('fighters')"><b>🥊</b>Бойцы</button><button onclick="openPanel('shop')"><b>🛍️</b>Магазин</button><button onclick="openPanel('profile')"><b>👤</b>Профиль</button></nav>
<div class="panel" id="panel"><button class="close" onclick="closePanel()">ЗАКРЫТЬ ✕</button><h2 id="ptitle"></h2><div id="pbody"></div></div>
<script>
let gems=50;const data={fighters:['🤠 Ranger — меткий стрелок','⚡ Volt — быстрый боец','🛡 Titan — крепкая защита'],shop:['🎁 Ежедневный подарок — скоро','💎 Кристаллы — демо-магазин','🎨 Скины — скоро'],profile:['Игрок: Sasha','Победы: 0','Трофеи: 0','Уровень: 1']};
function openPanel(k){if(k==='home')return;document.getElementById('panel').style.display='block';document.getElementById('ptitle').textContent={fighters:'ВЫБОР БОЙЦА',shop:'МАГАЗИН',profile:'ПРОФИЛЬ'}[k];document.getElementById('pbody').innerHTML=data[k].map(x=>'<div class="item">'+x+'</div>').join('')}
function closePanel(){document.getElementById('panel').style.display='none'}
function play(){openPanel('profile');document.getElementById('ptitle').textContent='ПОИСК МАТЧА';document.getElementById('pbody').innerHTML='<div class="item">Онлайн-сервер ещё не подключён. Это пока интерфейсная версия игры.</div>'}
document.getElementById('gems').textContent=gems;
</script></body></html>
