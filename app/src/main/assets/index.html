<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101a3b"><title>Brawl Arena Online</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 15%,#405d9a,#192951 48%,#090f25);color:#fff;font-family:system-ui,Arial;min-height:100vh;padding-bottom:86px}.top{display:flex;justify-content:space-between;align-items:center;padding:14px}.logo{font-weight:1000;font-size:21px;line-height:.9;color:#ffe477;text-shadow:0 3px #a64b24}.wallet{display:flex;gap:7px}.pill,.tag{background:#101a3b;border:2px solid #5976ad;border-radius:12px;padding:7px 10px;font-weight:900}.season{text-align:center;color:#9ce9ff;font-size:11px;font-weight:900;letter-spacing:2px;margin-top:8px}.hero{text-align:center;padding:8px 12px}.hero h1{font-size:34px;line-height:1;margin:8px;text-shadow:0 4px #101a3b}.hero p{margin:5px;color:#c6d8ff}.stage{height:230px;display:grid;place-items:center;position:relative}.orb{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;font-size:105px;background:radial-gradient(circle at 35% 25%,#fff0a2,#f58e43 55%,#823d80 78%);border:5px solid #ffdb70;box-shadow:0 0 0 8px #ffffff12,0 12px 35px #0008}.fighter-name{position:absolute;bottom:0;background:#172b56;border:2px solid #7296d2;border-radius:12px;padding:7px 20px;font-weight:1000}.primary{display:block;width:88%;max-width:370px;margin:20px auto 12px;border:0;border-radius:15px;padding:16px;background:linear-gradient(#ffe978,#f3a52d);color:#57280e;font-size:21px;font-weight:1000;box-shadow:0 5px #9d541e}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 14px}.tile{background:#1a2c56;border:2px solid #526fa7;border-radius:13px;text-align:center;padding:13px 3px;font-size:13px;font-weight:900}.tile b{display:block;font-size:24px;margin-bottom:3px}.hint{text-align:center;color:#a9bbdf;font-size:11px;margin:15px 20px 20px}.nav{position:fixed;bottom:0;left:0;right:0;background:#091126f5;border-top:1px solid #3b5484;display:flex;justify-content:space-around;padding:9px 2px 15px;z-index:3}.nav button{border:0;background:none;color:#c8d8ff;font-size:11px;font-weight:800}.nav b{display:block;font-size:22px}.panel{display:none;position:fixed;inset:0;overflow:auto;background:#090f25f7;z-index:5;padding:18px 16px 35px}.close{float:right;border:0;border-radius:10px;padding:9px 13px;background:#344d7e;color:white;font-weight:900}.panel h2{text-align:center;margin:48px 0 18px;font-size:24px}.item{background:linear-gradient(120deg,#1b2e5b,#172448);border:1px solid #5878b4;border-radius:14px;padding:15px;margin:10px 0;font-weight:800}.item small{display:block;color:#b7c9eb;font-weight:500;margin-top:5px}.action{float:right;background:#f6c64f;color:#44260d;border:0;border-radius:9px;padding:8px 10px;font-weight:900}.mode{display:flex;align-items:center;gap:12px}.mode span{font-size:27px}.muted{color:#a9bbdf;font-size:12px;text-align:center}
</style></head><body>
<header class="top"><div class="logo">BRAWL<br>ARENA</div><div class="wallet"><div class="pill">🟡 <span id="coins">1250</span></div><div class="pill">💎 <span id="gems">50</span></div></div></header>
<div class="season">СЕЗОН 01 · АРЕНА ЛЕГЕНД</div><section class="hero"><h1>ГОТОВ К БОЮ?</h1><p>Выбери бойца и покажи свой стиль</p></section>
<div class="stage"><div class="orb" id="heroIcon">🤠</div><div class="fighter-name" id="heroName">RANGER · РАНГ 8</div></div>
<button class="primary" onclick="openPanel('modes')">⚔ ИГРАТЬ</button>
<div class="quick"><div class="tile" onclick="openPanel('fighters')"><b>🥊</b>БОЙЦЫ</div><div class="tile" onclick="openPanel('shop')"><b>🛒</b>МАГАЗИН</div><div class="tile" onclick="openPanel('profile')"><b>👤</b>ПРОФИЛЬ</div></div>
<div class="hint">Тестовая версия · прогресс пока хранится только на этом устройстве</div>
<nav class="nav"><button onclick="goHome()"><b>🏠</b>Главная</button><button onclick="openPanel('fighters')"><b>🥊</b>Бойцы</button><button onclick="openPanel('modes')"><b>⚔️</b>Режимы</button><button onclick="openPanel('shop')"><b>🛍️</b>Магазин</button><button onclick="openPanel('profile')"><b>👤</b>Профиль</button></nav>
<div class="panel" id="panel"><button class="close" onclick="closePanel()">ЗАКРЫТЬ ✕</button><h2 id="ptitle"></h2><div id="pbody"></div></div>
<script>
let coins=Number(localStorage.getItem('ba_coins')||1250),gems=Number(localStorage.getItem('ba_gems')||50),selected=localStorage.getItem('ba_fighter')||'Ranger';
const fighters=[{name:'Ranger',icon:'🤠',desc:'Меткий стрелок на средней дистанции',rarity:'ОБЫЧНЫЙ'},{name:'Volt',icon:'⚡',desc:'Быстрый боец с резкими атаками',rarity:'РЕДКИЙ'},{name:'Titan',icon:'🛡️',desc:'Крепкий защитник команды',rarity:'ЭПИЧЕСКИЙ'}];
const modes=[['💎','ЗАХВАТ КРИСТАЛЛОВ','Собирай кристаллы и удерживай преимущество'],['🏆','СТОЛКНОВЕНИЕ','Сражайся за последнее место на арене'],['⚽','БРОУЛБОЛ','Забей два гола и победи']];
function sync(){document.getElementById('coins').textContent=coins;document.getElementById('gems').textContent=gems;let f=fighters.find(x=>x.name===selected)||fighters[0];document.getElementById('heroIcon').textContent=f.icon;document.getElementById('heroName').textContent=f.name.toUpperCase()+' · РАНГ 1';localStorage.setItem('ba_coins',coins);localStorage.setItem('ba_gems',gems);localStorage.setItem('ba_fighter',selected)}
function openPanel(k){let title={fighters:'ВЫБОР БОЙЦА',shop:'МАГАЗИН',profile:'ПРОФИЛЬ',modes:'ВЫБЕРИ РЕЖИМ'}[k];document.getElementById('ptitle').textContent=title;let html='';
if(k==='fighters')html=fighters.map(f=>'<div class="item">'+f.icon+' '+f.name+' <span class="tag">'+f.rarity+'</span><small>'+f.desc+'</small><button class="action" onclick="choose(\''+f.name+'\')">'+(selected===f.name?'ВЫБРАН':'ВЫБРАТЬ')+'</button><div style="clear:both"></div></div>').join('');
if(k==='modes')html=modes.map((m,i)=>'<div class="item mode"><span>'+m[0]+'</span><div><b>'+m[1]+'</b><small>'+m[2]+'</small></div></div>').join('')+'<p class="muted">Подбор соперников появится после подключения игрового сервера.</p>';
if(k==='shop')html='<div class="item">🎁 ЕЖЕДНЕВНЫЙ ПОДАРОК<small>Забери бесплатные монеты один раз в тестовой версии.</small><button class="action" onclick="gift()">ЗАБРАТЬ +100</button><div style="clear:both"></div></div><div class="item">💎 КРИСТАЛЛЫ<small>Демо-баланс: '+gems+' кристаллов. Покупки пока отключены.</small></div><div class="item">🎨 СКИНЫ<small>Коллекция обликов появится в следующем обновлении.</small></div>';
if(k==='profile')html='<div class="item">👤 ИГРОК: SASHA</div><div class="item">🏆 ПОБЕДЫ: 0</div><div class="item">🎖️ ТРОФЕИ: 0</div><div class="item">⭐ УРОВЕНЬ: 1</div><div class="item">🪙 МОНЕТЫ: '+coins+' · 💎 КРИСТАЛЛЫ: '+gems+'</div>';
document.getElementById('pbody').innerHTML=html;document.getElementById('panel').style.display='block'}
function choose(n){selected=n;sync();openPanel('fighters')}
function gift(){coins+=100;sync();openPanel('shop')}
function closePanel(){document.getElementById('panel').style.display='none'}
function goHome(){closePanel()}
sync();
</script></body></html>
