<script>

// Оригинальная короткая аркадная мелодия на Web Audio; запускается только после нажатия.
let musicContext=null,musicTimer=null,musicOn=false,musicStep=0;
function toggleMusic(){
 const button=document.getElementById('musicToggle');
 if(musicOn){musicOn=false;clearInterval(musicTimer);musicTimer=null;if(musicContext)musicContext.suspend();button.textContent='♫ ВКЛ. МУЗЫКУ';return}
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC){button.textContent='ЗВУК НЕДОСТУПЕН';return}
 if(!musicContext)musicContext=new AC();
 musicContext.resume();musicOn=true;button.textContent='♫ МУЗЫКА: ВКЛ.';
 const notes=[392,494,587,494,440,523,659,587,392,494,587,784,659,587,494,440];
 const playNote=()=>{if(!musicOn)return;const t=musicContext.currentTime,osc=musicContext.createOscillator(),gain=musicContext.createGain();osc.type='triangle';osc.frequency.value=notes[musicStep++%notes.length];gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.035,t+.025);gain.gain.exponentialRampToValueAtTime(.0001,t+.23);osc.connect(gain);gain.connect(musicContext.destination);osc.start(t);osc.stop(t+.24)};
 playNote();musicTimer=setInterval(playNote,260);
}
let coins=Number(localStorage.getItem('ba_coins')||1250),gems=Number(localStorage.getItem('ba_gems')||50),selected=localStorage.getItem('ba_fighter')||'Ranger';
const fighters=[{name:'Ranger',icon:'🤠',desc:'Меткий стрелок на средней дистанции',rarity:'ОБЫЧНЫЙ'},{name:'Volt',icon:'⚡',desc:'Быстрый боец с резкими атаками',rarity:'РЕДКИЙ'},{name:'Titan',icon:'🛡️',desc:'Крепкий защитник команды',rarity:'ЭПИЧЕСКИЙ'}];
const modes=[['💎','ЗАХВАТ КРИСТАЛЛОВ','Собирай кристаллы и удерживай преимущество'],['🏆','СТОЛКНОВЕНИЕ','Сражайся за последнее место на арене'],['⚽','БРОУЛБОЛ','Забей два гола и победи']];
function sync(){document.getElementById('coins').textContent=coins;document.getElementById('gems').textContent=gems;let f=fighters.find(x=>x.name===selected)||fighters[0];document.getElementById('heroIcon').textContent=f.icon;document.getElementById('heroName').textContent=f.name.toUpperCase()+' · РАНГ 1';localStorage.setItem('ba_coins',coins);localStorage.setItem('ba_gems',gems);localStorage.setItem('ba_fighter',selected)}
function openPanel(k){let title={fighters:'ВЫБОР БОЙЦА',shop:'МАГАЗИН',profile:'ПРОФИЛЬ',modes:'ВЫБЕРИ РЕЖИМ',news:'НОВОСТИ',friends:'ДРУЗЬЯ',club:'КЛУБ',chat:'ЧАТ'}[k];document.getElementById('ptitle').textContent=title;let html='';
if(k==='fighters')html=fighters.map(f=>'<div class="item">'+f.icon+' '+f.name+' <span class="tag">'+f.rarity+'</span><small>'+f.desc+'</small><button class="action" onclick="choose(\''+f.name+'\')">'+(selected===f.name?'ВЫБРАН':'ВЫБРАТЬ')+'</button><div style="clear:both"></div></div>').join('');
if(k==='modes')html=modes.map((m,i)=>'<div class="item mode" onclick="startMatch('+i+')" style="cursor:pointer"><span>'+m[0]+'</span><div><b>'+m[1]+'</b><small>'+m[2]+'</small></div><button class="action">ИГРАТЬ</button><div style="clear:both"></div></div>').join('')+'<p class="muted">Матчи проходят против тренировочных ботов. Онлайн-мультиплеер будет отдельным этапом.</p>';
if(k==='shop')html='<div class="item">🎁 ЕЖЕДНЕВНЫЙ ПОДАРОК<small>Забери бесплатные монеты один раз в тестовой версии.</small><button class="action" onclick="gift()">ЗАБРАТЬ +100</button><div style="clear:both"></div></div><div class="item">💎 КРИСТАЛЛЫ<small>Демо-баланс: '+gems+' кристаллов. Покупки пока отключены.</small></div><div class="item">🎨 СКИНЫ<small>Коллекция обликов появится в следующем обновлении.</small></div>';
if(k==='news')html='<div class="item">📢 НОВОСТИ АРЕНЫ<small>Добро пожаловать! Новые события и режимы появятся здесь.</small></div>';
if(k==='friends')html='<div class="item">👥 ДРУЗЬЯ<small>Список друзей пока пуст. Онлайн-приглашения добавим после подключения аккаунтов.</small></div>';
if(k==='club')html='<div class="item">🛡️ КЛУБ<small>Создание клуба будет доступно в следующем обновлении.</small></div>';
if(k==='chat')html='<div class="item">💬 ЧАТ<small>Чат пока недоступен в этой тестовой версии.</small></div>';
if(k==='profile')html='<div class="item">👤 ИГРОК: SASHA</div><div class="item">🏆 ПОБЕДЫ: '+wins+'</div><div class="item">🎖️ ТРОФЕИ: '+trophies+'</div><div class="item">⭐ УРОВЕНЬ: 1</div><div class="item">🪙 МОНЕТЫ: '+coins+' · 💎 КРИСТАЛЛЫ: '+gems+'</div>';
document.getElementById('pbody').innerHTML=html;document.getElementById('panel').style.display='block'}
function choose(n){selected=n;sync();openPanel('fighters')}
function gift(){if(localStorage.getItem('ba_gift_day')===new Date().toDateString()){alert('Подарок уже получен сегодня!');return}coins+=100;localStorage.setItem('ba_gift_day',new Date().toDateString());sync();openPanel('shop')}
function closePanel(){document.getElementById('panel').style.display='none'}
function goHome(){closePanel()}
let wins=Number(localStorage.getItem('ba_wins')||0),trophies=Number(localStorage.getItem('ba_trophies')||0);
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
let game=null,raf=0,lastFrame=0,stick={x:0,y:0},keys={};
function resizeGame(){let dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resizeGame);
function startMatch(i){closePanel();document.getElementById('arena').style.display='block';resizeGame();let w=innerWidth,h=innerHeight;game={mode:i,player:{x:w/2,y:h/2,hp:100,max:100,r:17,speed:selected==='Volt'?3.6:selected==='Titan'?2.45:3.0,cd:0},bots:[],shots:[],particles:[],time:120,score:0,ended:false,last:performance.now()};for(let n=0;n<5;n++){let a=n*Math.PI*2/5;game.bots.push({x:w/2+Math.cos(a)*Math.min(w,h)*.34,y:h/2+Math.sin(a)*Math.min(w,h)*.34,hp:55,max:55,r:15,cd:Math.random()*80,speed:1.1+Math.random()*.45})}document.getElementById('modeLabel').textContent=modes[i][1];document.getElementById('matchMessage').innerHTML='БОЙ НАЧАЛСЯ<small>Двигайся джойстиком и нажимай АТАКА</small>';setTimeout(()=>{if(game&&!game.ended)document.getElementById('matchMessage').textContent=''},1400);cancelAnimationFrame(raf);lastFrame=performance.now();raf=requestAnimationFrame(loop)}
function drawArena(){let w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#254d49';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#ffffff12';ctx.lineWidth=1;for(let x=0;x<w;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.fillStyle='#315d50';for(let x=22;x<w;x+=105)for(let y=110;y<h;y+=115){ctx.beginPath();ctx.arc(x+(y%3)*8,y,13,0,Math.PI*2);ctx.fill()}if(!game)return;
for(let s of game.shots){ctx.fillStyle=s.team?'#ffe27a':'#ff775f';ctx.beginPath();ctx.arc(s.x,s.y,5,0,Math.PI*2);ctx.fill()}
for(let b of game.bots){ctx.fillStyle='#d95758';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(b.x-12,b.y-23,24,4);ctx.fillStyle='#68e078';ctx.fillRect(b.x-12,b.y-23,24*Math.max(0,b.hp/b.max),4);ctx.fillStyle='#fff';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('🤖',b.x,b.y+5)}
let p=game.player;ctx.fillStyle=selected==='Volt'?'#58d9ed':selected==='Titan'?'#b7b7d7':'#f5bd50';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#26334c';ctx.beginPath();ctx.arc(p.x+4,p.y-4,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(selected.toUpperCase(),p.x,p.y+31);
for(let q of game.particles){ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.arc(q.x,q.y,3,0,Math.PI*2);ctx.fill()}}
function loop(now){if(!game||game.ended)return;let dt=Math.min((now-game.last)/16.67,2);game.last=now;let p=game.player,w=innerWidth,h=innerHeight;let mx=stick.x+(keys.a?-1:0)+(keys.d?1:0),my=stick.y+(keys.w?-1:0)+(keys.s?1:0),len=Math.hypot(mx,my)||1;p.x=Math.max(20,Math.min(w-20,p.x+mx/Math.max(1,len)*p.speed*dt));p.y=Math.max(85,Math.min(h-25,p.y+my/Math.max(1,len)*p.speed*dt));if(p.cd>0)p.cd-=dt;
for(let b of game.bots){let dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy)||1;if(d>90){b.x+=dx/d*b.speed*dt;b.y+=dy/d*b.speed*dt}b.cd-=dt;if(b.cd<=0&&d<340){b.cd=70+Math.random()*35;game.shots.push({x:b.x,y:b.y,vx:dx/d*3.5,vy:dy/d*3.5,team:false,life:100})}}
for(let s of game.shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.team){for(let b of game.bots)if(b.hp>0&&Math.hypot(s.x-b.x,s.y-b.y)<b.r+5){b.hp-=24;s.life=0;if(b.hp<=0){game.score++;game.particles.push({x:b.x,y:b.y})}break}}else if(Math.hypot(s.x-p.x,s.y-p.y)<p.r+5){p.hp-=12;s.life=0}}
game.shots=game.shots.filter(s=>s.life>0);game.bots=game.bots.filter(b=>b.hp>0);game.particles=game.particles.slice(-10);game.time-=dt/60;document.getElementById('hpText').textContent=Math.max(0,Math.ceil(p.hp));document.getElementById('healthFill').style.width=Math.max(0,p.hp)+'%';document.getElementById('timer').textContent='0'+Math.floor(game.time/60)+':'+String(Math.max(0,Math.floor(game.time%60))).padStart(2,'0');document.getElementById('score').textContent=game.score;
if(p.hp<=0){endMatch(false,false);return}if(game.bots.length===0){endMatch(true,false);return}if(game.time<=0){endMatch(game.score>=3,false);return}drawArena();raf=requestAnimationFrame(loop)}
function shoot(){if(!game||game.ended||game.player.cd>0)return;let p=game.player,best=null,dist=1e9;for(let b of game.bots){let d=Math.hypot(b.x-p.x,b.y-p.y);if(d<dist){dist=d;best=b}}if(!best)return;let dx=best.x-p.x,dy=best.y-p.y,d=Math.hypot(dx,dy)||1;game.shots.push({x:p.x,y:p.y,vx:dx/d*7,vy:dy/d*7,team:true,life:65});p.cd=selected==='Volt'?11:selected==='Titan'?24:17}
function endMatch(won,quit){if(!game||game.ended)return;game.ended=true;cancelAnimationFrame(raf);document.getElementById('matchMessage').innerHTML=quit?'МАТЧ ЗАВЕРШЁН':won?'ПОБЕДА! 🏆':'ПОРАЖЕНИЕ<small>Счёт: '+game.score+'</small>';if(won){coins+=50;wins++;trophies+=8;localStorage.setItem('ba_wins',wins);localStorage.setItem('ba_trophies',trophies);sync()}else if(!quit){coins+=10;sync()}setTimeout(()=>{document.getElementById('arena').style.display='none';game=null;openPanel('profile')},quit?200:1800)}
const stickEl=document.getElementById('stick'),knob=document.getElementById('knob');function moveStick(e){let r=stickEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy),max=36;if(d>max){dx=dx/d*max;dy=dy/d*max}stick.x=dx/max;stick.y=dy/max;knob.style.transform='translate('+dx+'px,'+dy+'px)'}stickEl.addEventListener('pointerdown',e=>{stickEl.setPointerCapture(e.pointerId);moveStick(e)});stickEl.addEventListener('pointermove',e=>{if(stickEl.hasPointerCapture(e.pointerId))moveStick(e)});function resetStick(){stick.x=0;stick.y=0;knob.style.transform='translate(0,0)'}stickEl.addEventListener('pointerup',resetStick);stickEl.addEventListener('pointercancel',resetStick);
let attackTimer=null;const attackBtn=document.getElementById('attack');attackBtn.addEventListener('pointerdown',e=>{e.preventDefault();shoot();attackTimer=setInterval(shoot,180)});['pointerup','pointercancel','pointerleave'].forEach(ev=>attackBtn.addEventListener(ev,()=>{clearInterval(attackTimer);attackTimer=null}));
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();shoot()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
sync();
