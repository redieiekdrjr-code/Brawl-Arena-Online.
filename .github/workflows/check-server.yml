name: Check multiplayer server

on:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check-server.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: node --check server.js
      - name: Start server and test health endpoint
        run: |
          PORT=3000 npm start > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/health > health.json; then
              cat health.json
              grep -q '"ok":true' health.json
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1
